<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SandStrike</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#101216;color:#F2EFE6;
 font-family:Roboto,Arial,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:3vh 4vw}
.screen.on{display:flex}
.title{font-size:7vh;font-weight:900;letter-spacing:.14em;color:#E2B866;line-height:1;margin-top:2vh}
.sub{font-size:2vh;color:#8A9099;letter-spacing:.2em;margin-top:1vh}
.row{display:flex;gap:2vh;align-items:center}
.spread{justify-content:space-between}
.btn{background:#191C21ee;border:2px solid #2A2E35;color:#F2EFE6;border-radius:12px;
 font-size:2.6vh;font-weight:800;letter-spacing:.06em;padding:2vh 2.5vh;text-align:center;
 transition:transform .08s,border-color .08s}
.btn:active{transform:scale(.96);border-color:#E2B866}
.btn.primary{background:#E2B866;color:#101216;border-color:#E2B866}
.btn.sel{border-color:#E2B866;color:#E2B866}
.panel{background:#101216d9;border:2px solid #282C33;border-radius:16px;padding:2.5vh}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1vh;overflow:auto;flex:1;align-content:start}
.grid .btn{font-size:1.8vh;padding:1.4vh .4vh;min-height:6vh}
.list{display:grid;grid-template-columns:1fr 1fr;gap:1vh;overflow:auto;flex:1;align-content:start}
.list .btn{font-size:2vh;padding:1.4vh}
.stats{font-size:2vh;line-height:1.5;color:#C9CDD2}
.small{font-size:1.7vh;color:#8A9099}
#hud{position:absolute;inset:0;display:none;pointer-events:none}
#hud.on{display:block}
.hudbox{position:absolute;font-size:2.4vh;font-weight:800;text-shadow:0 2px 4px #000}
#hL{left:3vw;top:2vh}#hR{right:3vw;top:2vh;text-align:right}
#feed{left:50%;top:8vh;transform:translateX(-50%);color:#E2B866;text-align:center}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;opacity:.85}
#cross:before{left:9px;top:0;width:2px;height:20px}
#cross:after{top:9px;left:0;height:2px;width:20px}
.tbtn{position:absolute;pointer-events:auto;background:#191C21cc;border:2px solid #333840;
 color:#F2EFE6;border-radius:50%;width:11vh;height:11vh;font-size:2vh;font-weight:900;text-align:center;line-height:10vh}
.tbtn:active{background:#E2B866;color:#101216}
#fire{right:5vw;bottom:8vh;width:14vh;height:14vh;line-height:13vh;background:#E2B86655;border-color:#E2B866}
#reload{right:19vw;bottom:5vh}#knife{right:5vw;bottom:26vh}#jump{right:19vw;bottom:19vh}
#pause{right:3vw;top:9vh;width:7vh;height:7vh;line-height:6vh;border-radius:12px;font-size:2.2vh}
#joy{position:absolute;left:6vw;bottom:8vh;width:20vh;height:20vh;border-radius:50%;
 border:2px solid #ffffff22;background:#ffffff0d;pointer-events:auto;display:none}
#knob{position:absolute;left:50%;top:50%;width:8vh;height:8vh;margin:-4vh;border-radius:50%;background:#E2B86699}
#veil{position:fixed;inset:0;background:#0000;pointer-events:none}
</style>
</head>
<body>
<div id="gl"></div>
<div id="veil"></div>

<div class="screen on" id="menu">
  <div class="title">SANDFALL</div>
  <div class="sub">ПЕСЧАНЫЙ ШТОРМ · OFFLINE FPS</div>
  <div class="spread row" style="flex:1;align-items:flex-end;padding-bottom:2vh">
    <div>
      <div class="btn primary" style="width:38vw" data-go="play">ИГРАТЬ</div>
      <div class="row" style="margin-top:1.4vh">
        <div class="btn" style="width:18vw" data-go="weapons">ОРУЖИЕ</div>
        <div class="btn" style="width:18vw" data-go="skins">СКИНЫ</div>
      </div>
    </div>
    <div style="text-align:right">
      <div class="btn" style="width:30vw" data-go="settings">НАСТРОЙКИ</div>
      <div class="small" id="menuStats" style="margin-top:1.4vh"></div>
    </div>
  </div>
</div>

<div class="screen" id="weapons">
  <div class="row spread"><div class="title" style="font-size:5vh">ОРУЖИЕ · 30</div><div class="btn" data-go="menu">НАЗАД</div></div>
  <div class="grid" id="weaponGrid"></div>
  <div class="panel" id="weaponStats" style="margin-top:1vh"></div>
</div>

<div class="screen" id="skins">
  <div class="row spread"><div class="title" style="font-size:5vh">СКИНЫ</div><div class="btn" data-go="menu">НАЗАД</div></div>
  <div class="list" id="skinLists"></div>
</div>

<div class="screen" id="settings">
  <div class="row spread"><div class="title" style="font-size:5vh">НАСТРОЙКИ</div><div class="btn" data-go="menu">НАЗАД</div></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:1.5vh">
    <div class="row spread"><span class="stats" id="setBots"></span><span class="row"><span class="btn" data-set="bots-">−</span><span class="btn" data-set="bots+">+</span></span></div>
    <div class="row spread"><span class="stats" id="setDiff"></span><span class="btn" data-set="diff">СМЕНИТЬ</span></div>
    <div class="row spread"><span class="stats" id="setSens"></span><span class="row"><span class="btn" data-set="sens-">−</span><span class="btn" data-set="sens+">+</span></span></div>
    <div class="row spread"><span class="stats" id="setMap"></span><span class="btn" data-set="map">СМЕНИТЬ</span></div>
    <div class="row spread"><span class="stats" id="setSound"></span><span class="btn" data-set="sound">СМЕНИТЬ</span></div>
  </div>
</div>

<div class="screen" id="pause">
  <div class="title" style="text-align:center;margin-top:15vh">ПАУЗА</div>
  <div style="display:flex;flex-direction:column;gap:2vh;width:50vw;margin:6vh auto">
    <div class="btn primary" data-go="resume">ПРОДОЛЖИТЬ</div>
    <div class="btn" data-go="weapons">ОРУЖИЕ</div>
    <div class="btn" data-go="skins">СКИНЫ</div>
    <div class="btn" data-go="menu">В МЕНЮ</div>
  </div>
</div>

<div id="hud">
  <div class="hudbox" id="hL"></div>
  <div class="hudbox" id="hR"></div>
  <div class="hudbox" id="feed"></div>
  <div id="cross"></div>
  <div class="tbtn" id="fire">ОГОНЬ</div>
  <div class="tbtn" id="reload">RLD</div>
  <div class="tbtn" id="knife">НОЖ</div>
  <div class="tbtn" id="jump">JMP</div>
  <div class="tbtn" id="pause">II</div>
  <div id="joy"><div id="knob"></div></div>
</div>

<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
